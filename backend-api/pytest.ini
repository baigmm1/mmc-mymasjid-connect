[pytest]
# Test discovery configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Pytest options - no manual PYTHONPATH configuration needed
# conftest.py automatically adds backend-api to sys.path
addopts = -v --tb=short --strict-markers

# Custom test markers for organizing tests
markers =
    unit: unit tests (fast, isolated, no external dependencies)
    integration: integration tests (database, external services)
    contract: contract tests (API contracts, documentation)

# Async test configuration
asyncio_mode = auto
